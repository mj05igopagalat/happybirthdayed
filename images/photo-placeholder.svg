<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="title description">
  <title id="title">Photo placeholder</title>
  <desc id="description">A soft floral illustration with a reminder to add a favorite birthday photo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ece3"/>
      <stop offset="1" stop-color="#f3e7e2"/>
    </linearGradient>
  </defs>
  <rect width="640" height="410" fill="url(#background)"/>
  <g fill="#b57d72" opacity=".65">
    <circle cx="320" cy="145" r="20"/>
    <ellipse cx="320" cy="111" rx="14" ry="24"/>
    <ellipse cx="320" cy="179" rx="14" ry="24"/>
    <ellipse cx="286" cy="145" rx="24" ry="14"/>
    <ellipse cx="354" cy="145" rx="24" ry="14"/>
    <ellipse cx="296" cy="121" rx="14" ry="23" transform="rotate(-45 296 121)"/>
    <ellipse cx="344" cy="121" rx="14" ry="23" transform="rotate(45 344 121)"/>
    <ellipse cx="296" cy="169" rx="14" ry="23" transform="rotate(45 296 169)"/>
    <ellipse cx="344" cy="169" rx="14" ry="23" transform="rotate(-45 344 169)"/>
  </g>
  <circle cx="320" cy="145" r="13" fill="#d9ad72"/>
  <text x="320" y="235" fill="#8e4552" font-family="Georgia,serif" font-size="25" text-anchor="middle">A favorite photo goes here</text>
  <text x="320" y="270" fill="#8d7470" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Replace this image with a photo of Raizza</text>
</svg>
